# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-gei-nxpcup"
BBFILE_PATTERN_meta-gei-nxpcup = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-gei-nxpcup = "9"

LAYERDEPENDS_meta-gei-nxpcup = "core"
LAYERSERIES_COMPAT_meta-gei-nxpcup = "whinlatter"
